# Fail2Ban filter for nginx badbots

[Definition]

# nginx combined log format: $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"
failregex = ^<HOST> -.*"(?:GET|POST|HEAD)[^"]*" \d+ \d+ "[^"]*" "(?:[^"]*(?:wget|HTTrack|libwww-perl|BBBike|winhttp|clshttp|archiver|loader|email|harvest|extract|grab|miner|python-requests/|Go-http-client/|java/|okhttp/|scrapy/|sqlmap/|pangolin|nmap|masscan|dirb|wpscan|nikto|hydra|gobuster|dirsearch|whatweb|wafw00f|acunetix|openvas|nessus|qualysguard|rapid7|metasploit|burpsuite|owasp|sqlninja|beef|beEF|social-engineer|burp|owasp-zap)[^"]*)"

ignoreregex =