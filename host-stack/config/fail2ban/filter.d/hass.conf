[INCLUDES]
before = common.conf

[Definition]
# HA log format: YYYY-MM-DD HH:MM:SS LEVEL (Thread) [component] message
# After date-stripping by fail2ban, the remaining line starts with the log level.
failregex = ^.*Login attempt or request with invalid authentication from <HOST>.*$

ignoreregex =

[Init]
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S