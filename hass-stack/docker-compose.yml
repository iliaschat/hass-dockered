services:
  core-mariadb:
    image: mariadb:lts
    container_name: core-mariadb
    profiles:
      - extra
      - full
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./config/mariadb/backup:/backup
      - ./config/mariadb/conf:/var/lib/mysql
      # If there is not scheme, restore the last created backup (if exists)
      - ./config/mariadb/backup/latest.${MYSQL_DATABASE}.sql.gz:/docker-entrypoint-initdb.d/database.sql.gz
    restart: unless-stopped
    # network_mode: host
    # Uncomment below to use bridge networking instead of host
    networks:
      - hass-network
    ports:
      - 3306:3306

  mysql-cron-backup:
    image: fradelg/mysql-cron-backup
    container_name: mysql-cron-backup
    depends_on:
      - core-mariadb
    profiles:
      - extra
      - full
    volumes:
      - ./config/mariadb/backup:/backup
    environment:
      - TZ=${TZ}
      - MYSQL_HOST=192.168.178.28
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASS=${MYSQL_ROOT_PASSWORD}
      - MAX_BACKUPS=15
      - INIT_BACKUP=0
      # Every day at 22:00
      - CRON_TIME=0 22 * * *
      # Make it small
      - GZIP_LEVEL=9
    restart: unless-stopped

  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:stable
    profiles:
      - basic
      - extra
      - full
    environment:
      - TZ=${TZ}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /run/dbus:/run/dbus:ro
      - ./config/hass_config:/config
#      - ../sys-stack/config/letsencrypt:/etc/letsencrypt:ro
      - cert_volume:/etc/letsencrypt:ro
    restart: unless-stopped
    # network_mode: host
    # Uncomment below to use bridge networking instead of host
    ports:
      - "8123:8123"
    networks:
      - hass-network

  esphome:
    image: ghcr.io/esphome/esphome:stable
    container_name: esphome
    depends_on:
      - homeassistant
    profiles:
      - extra
      - full
    environment:
      - TZ=${TZ}
      - ESPHOME_DASHBOARD_USE_PING=true
      - ESPHOME_USERNAME=${ESPHOME_USERNAME}
      - ESPHOME_PASSWORD=${ESPHOME_PASSWORD}
    volumes:
      - ./config/hass_config/esphome:/config
    restart: unless-stopped
    networks:
      - hass-network
    ports:
      - 6052:6052
      - 6053:6053

  core-configurator:
    image: causticlab/hass-configurator-docker:arm
    container_name: core-configurator
    depends_on:
      - homeassistant
    #    user: ${PUID}:${PGID}
    profiles:
      - full
    volumes:
      - ./config/configurator:/config
      - ./config/hass_config:/hass-config
    restart: unless-stopped
    networks:
      - hass-network
    ports:
      - 3218:3218/tcp

volumes:
  cert_volume:
    name: cert_volume

networks:
  hass-network:
    driver: bridge
